<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--carvao);font-family:var(--font-sans-body);color:var(--text-body);font-weight:300}.lbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-faint)}.mono{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--text-muted);letter-spacing:.02em}</style></head><body><div style="padding:22px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:14">
<div style="display:grid;gap:6px"><div style="height:104px;background:var(--grad-vinho-carvao);border-radius:4px;border:1px solid var(--areia-a08)"></div><div class="lbl">--grad-vinho-carvao</div></div>
<div style="display:grid;gap:6px"><div style="height:104px;background:var(--grad-carvao-vinho);border-radius:4px;border:1px solid var(--areia-a08)"></div><div class="lbl">--grad-carvao-vinho</div></div>
<div style="display:grid;gap:6px"><div style="height:104px;background:var(--grad-carvao-deep);border-radius:4px;border:1px solid var(--areia-a08)"></div><div class="lbl">--grad-carvao-deep</div></div>
</div></body></html>
