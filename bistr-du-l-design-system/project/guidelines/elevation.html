<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--carvao);font-family:var(--font-sans-body);color:var(--text-body);font-weight:300}.lbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-faint)}.mono{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--text-muted);letter-spacing:.02em}</style></head><body><div style="padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:16">
<div style="background:var(--surface-card);border:1px solid var(--verde-garrafa);border-radius:6px;padding:18px"><div style="font-family:var(--font-serif-display);font-size:19px;font-weight:500;color:var(--text-strong)">Correto</div><div class="mono" style="margin-top:6px">border 1px var(--verde-garrafa)</div></div>
<div style="background:var(--surface-card);border-radius:6px;padding:18px;box-shadow:0 10px 26px rgba(0,0,0,.55);opacity:.55"><div style="font-family:var(--font-serif-display);font-size:19px;font-weight:500;color:var(--text-strong)">Proibido</div><div class="mono" style="margin-top:6px">box-shadow difusa genérica</div></div>
</div></body></html>
