<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--carvao);font-family:var(--font-sans-body);color:var(--text-body);font-weight:300}.lbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-faint)}.mono{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--text-muted);letter-spacing:.02em}</style></head><body><div style="padding:24px;display:flex;gap:16;align-items:center">
