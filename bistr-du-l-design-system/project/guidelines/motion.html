<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--carvao);font-family:var(--font-sans-body);color:var(--text-body);font-weight:300}.lbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-faint)}.mono{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--text-muted);letter-spacing:.02em}</style></head><body><div style="padding:24px;display:grid;gap:12">
<div class="mono">--dur-fast 140ms · --dur-base 240ms · --dur-slow 520ms</div>
<div class="mono">--ease-out cubic-bezier(.22,.61,.36,1) — entradas · --ease-in-out — troca de estado</div>
<div style="display:flex;gap:12;align-items:center"><span style="border:1px solid var(--verde-300);border-radius:4px;padding:9px 16px;font-size:13px;transition:var(--t-color)">hover → cor, nunca escala</span><span class="mono">reveal: opacity + translateY(8px)</span></div>
</div></body></html>
