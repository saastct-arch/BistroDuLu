<!-- @dsCard group="Colors" viewport="700x180" name="Núcleo da paleta" subtitle="The five brand colours — nothing outside this set" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--carvao);font-family:var(--font-sans-body);color:var(--text-body);font-weight:300}.lbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-faint)}.mono{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--text-muted);letter-spacing:.02em}</style></head><body><div style="padding:22px;display:grid;grid-template-columns:repeat(5,1fr);gap:14">
<div style="display:grid;gap:6px"><div style="height:64px;background:var(--vinho-arroxeado);border:1px solid var(--areia-a14);border-radius:4px"></div><div class="lbl">vinho arroxeado</div><div class="mono">#4E1517</div></div>
<div style="display:grid;gap:6px"><div style="height:64px;background:var(--carvao);border:1px solid var(--areia-a14);border-radius:4px"></div><div class="lbl">carvão</div><div class="mono">#17120F</div></div>
<div style="display:grid;gap:6px"><div style="height:64px;background:var(--verde-garrafa);border:1px solid var(--areia-a14);border-radius:4px"></div><div class="lbl">verde garrafa</div><div class="mono">#1F3327</div></div>
<div style="display:grid;gap:6px"><div style="height:64px;background:var(--terracota-suave);border:1px solid var(--areia-a14);border-radius:4px"></div><div class="lbl">terracota suave</div><div class="mono">#B06A55</div></div>
<div style="display:grid;gap:6px"><div style="height:64px;background:var(--areia-quente);border:1px solid var(--areia-a14);border-radius:4px"></div><div class="lbl">areia quente</div><div class="mono">#D9C9B3</div></div>
</div></body></html>
